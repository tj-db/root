<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icons/512x512.png">
    <title>POSTBOX</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <style>
      :root {
        --bg-primary: #1a1a1a;
        --text-primary: #ffffff;
        --accent: #4CAF50;
        --error: #ff4444;
        --card-bg: #2d2d2d;
        --field-bg: #333333;
        --muted-bg: #555555;
        --touch: 44px;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, system-ui, -apple-system, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        background-color: var(--bg-primary);
        color: var(--text-primary);
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding:
          calc(clamp(0.75rem, 4vw, 2rem) + var(--safe-top))
          calc(clamp(0.75rem, 4vw, 2rem) + var(--safe-right))
          calc(clamp(0.75rem, 4vw, 2rem) + var(--safe-bottom))
          calc(clamp(0.75rem, 4vw, 2rem) + var(--safe-left));
      }
      .container {
        position: relative;
        width: 100%;
        max-width: 800px;
        background-color: var(--card-bg);
        padding: clamp(1rem, 4vw, 2rem);
        border-radius: clamp(16px, 3vw, 22px);
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      h1 {
        margin-bottom: clamp(1rem, 4vw, 2rem);
        padding: 0 var(--touch);
        color: var(--accent);
        font-size: clamp(2rem, 9vw, 3.3rem);
        line-height: 1.1;
        letter-spacing: 0.02em;
      }
      .peer-id {
        margin: 0 0 1rem;
        color: var(--accent);
        font-size: clamp(1.5rem, 7vw, 2rem);
        font-weight: bold;
        letter-spacing: 0.15em;
        font-variant-numeric: tabular-nums;
      }
      .connect-form {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
        margin-bottom: 1rem;
      }
      input, button {
        min-height: var(--touch);
        padding: 0.5rem 1.1rem;
        border: none;
        border-radius: 16px;
        font-size: 1rem;
        touch-action: manipulation;
      }
      input[type="text"] {
        flex: 1 1 12rem;
        min-width: 0;
        max-width: 18rem;
        background-color: var(--field-bg);
        color: var(--text-primary);
        font-size: 1rem;
        text-align: center;
      }
      input[type="text"]::placeholder {
        color: rgba(255, 255, 255, 0.5);
      }
      button {
        background-color: var(--accent);
        color: white;
        cursor: pointer;
        transition: opacity 0.2s, transform 0.1s;
      }
      button:active {
        transform: scale(0.97);
      }
      #connect-btn {
        flex: 0 1 auto;
        min-width: 6rem;
      }
      :focus-visible {
        outline: 2px solid #ffffff;
        outline-offset: 2px;
      }
      .message {
        min-height: 1.5rem;
        margin: 0.5rem 0 1rem;
        color: var(--accent);
        overflow-wrap: anywhere;
      }
      .message.error {
        color: var(--error);
      }
      .file-transfer {
        display: none;
        margin-top: 1rem;
      }
      #select-files {
        width: 100%;
        max-width: 18rem;
      }
      .file-list {
        margin-top: 1rem;
        list-style: none;
      }
      .file-list:empty {
        margin-top: 0;
      }
      .file-item {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 0.75rem 1rem;
        margin-bottom: 0.5rem;
        padding: 0.9rem 1rem;
        background-color: var(--field-bg);
        border-radius: 11px;
        text-align: left;
      }
      .file-info {
        flex: 1 1 14rem;
        min-width: 0;
      }
      .file-name {
        overflow-wrap: anywhere;
        word-break: break-word;
      }
      .file-status {
        margin-top: 0.2rem;
        font-size: 0.85rem;
        opacity: 0.7;
        overflow-wrap: anywhere;
      }
      .file-status.error {
        color: var(--error);
        opacity: 1;
      }
      .file-actions {
        display: flex;
        flex: 0 1 auto;
        flex-wrap: wrap;
        gap: 0.5rem;
        justify-content: flex-end;
      }
      .file-actions:empty {
        display: none;
      }
      .file-actions a,
      .file-actions button {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        min-height: var(--touch);
        padding: 0.5rem 1rem;
        border-radius: 16px;
        font-size: 0.9rem;
      }
      .file-actions a {
        background-color: var(--accent);
        color: white;
        text-decoration: none;
      }
      .file-actions button.secondary {
        background-color: var(--muted-bg);
      }
      .progress-bar {
        height: 6px;
        margin-top: 0.5rem;
        background-color: #444444;
        border-radius: 6px;
        overflow: hidden;
      }
      .progress {
        height: 100%;
        width: 0%;
        background-color: var(--accent);
        transition: width 0.3s;
      }
      .tools {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 1rem;
        margin-top: 1rem;
      }
      #refresh-btn,
      #reset-btn {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        width: 3.5rem;
        height: 3.5rem;
        padding: 0;
        background-color: transparent;
        border-radius: 50%;
      }
      #refresh-btn {
        font-size: 2rem;
        transition: transform 1.1s ease, opacity 0.2s;
      }
      #reset-btn {
        font-size: 1.7rem;
      }
      #qr-btn {
        position: absolute;
        top: clamp(0.5rem, 2vw, 1rem);
        right: clamp(0.5rem, 2vw, 1rem);
        display: inline-flex;
        justify-content: center;
        align-items: center;
        width: 3rem;
        height: 3rem;
        padding: 0;
        background-color: transparent;
        border-radius: 12px;
        color: var(--accent);
        font-size: 1.8rem;
      }
      .modal {
        position: fixed;
        inset: 0;
        display: none;
        justify-content: center;
        align-items: center;
        padding:
          calc(1rem + var(--safe-top))
          calc(1rem + var(--safe-right))
          calc(1rem + var(--safe-bottom))
          calc(1rem + var(--safe-left));
        background-color: rgba(0, 0, 0, 0.7);
        overflow-y: auto;
        overscroll-behavior: contain;
        z-index: 100;
      }
      .modal.open {
        display: flex;
      }
      .modal-card {
        position: relative;
        width: 100%;
        max-width: 360px;
        margin: auto;
        padding: 2.75rem 1.5rem 1.5rem;
        background-color: var(--card-bg);
        border-radius: 22px;
        text-align: center;
      }
      .modal-close {
        position: absolute;
        top: 0.4rem;
        right: 0.4rem;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        width: 3rem;
        height: 3rem;
        padding: 0;
        background-color: transparent;
        color: var(--text-primary);
        font-size: 1.4rem;
      }
      .qr-frame {
        display: inline-block;
        padding: 12px;
        background-color: #ffffff;
        border-radius: 14px;
        line-height: 0;
      }
      .qr-frame img {
        display: block;
        width: min(240px, 100%, 55vh);
        height: auto;
        aspect-ratio: 1 / 1;
        image-rendering: pixelated;
      }
      .qr-caption {
        margin-top: 1rem;
        font-size: 0.9rem;
        opacity: 0.8;
      }
      .qr-id {
        margin-top: 0.3rem;
        color: var(--accent);
        font-size: 1.6rem;
        font-weight: bold;
        letter-spacing: 0.15em;
      }
      @media (hover: hover) {
        button:hover {
          opacity: 0.9;
        }
        #refresh-btn:hover {
          transform: rotate(360deg);
        }
        .file-actions a:hover {
          opacity: 0.9;
        }
      }
      @media (max-width: 480px) {
        .connect-form {
          flex-direction: column;
          align-items: stretch;
        }
        input[type="text"] {
          flex: 0 0 auto;
          max-width: none;
          width: 100%;
        }
        #connect-btn {
          width: 100%;
        }
        #select-files {
          max-width: none;
        }
        .file-item {
          flex-direction: column;
          align-items: stretch;
        }
        .file-info {
          flex: 0 0 auto;
        }
        .file-actions {
          justify-content: stretch;
        }
        .file-actions a,
        .file-actions button {
          flex: 1 1 calc(50% - 0.25rem);
        }
      }
      @media (min-width: 481px) and (max-width: 1024px) {
        .container {
          max-width: 640px;
        }
      }
      @media (min-width: 1025px) {
        .container {
          padding: 2.5rem;
        }
      }
      @media (max-height: 520px) and (orientation: landscape) {
        body {
          justify-content: flex-start;
        }
        h1 {
          margin-bottom: 0.75rem;
          font-size: 1.8rem;
        }
        .modal-card {
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          justify-content: center;
          gap: 1rem;
          max-width: 520px;
          padding-top: 2.5rem;
        }
        .qr-frame img {
          width: min(200px, 60vh);
        }
        .qr-caption {
          margin-top: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <button id="qr-btn" aria-label="Show QR code" title="Show QR code">
        <i class="fa-solid fa-qrcode"></i>
      </button>
      <h1>POSTBOX</h1>
      <div id="host-section">
        <div class="peer-id" id="peer-id">Connecting...</div>
      </div>
      <div id="connect-section">
        <div class="connect-form">
          <input type="text" id="connect-id" placeholder="Connect to ID no." maxlength="4" inputmode="numeric" pattern="\d{4}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Peer ID to connect to">
          <button id="connect-btn">Join</button>
        </div>
      </div>
      <div id="message" class="message" role="status" aria-live="polite"></div>
      <div class="file-transfer" id="file-transfer">
        <input type="file" id="file-input" multiple style="display: none">
        <button id="select-files">Select Files</button>
      </div>
      <input type="file" id="resume-input" style="display: none">
      <ul class="file-list" id="file-list"></ul>
      <div class="tools">
        <button id="refresh-btn" aria-label="Refresh" title="Refresh">
          <i class="fa-solid fa-rotate" style="color: var(--accent);"></i>
        </button>
        <button id="reset-btn" aria-label="Reset all data" title="Reset all data">
          <i class="fa-solid fa-trash" style="color: var(--error);"></i>
        </button>
      </div>
    </div>
    <div class="modal" id="qr-modal" role="dialog" aria-modal="true" aria-label="QR code">
      <div class="modal-card">
        <button class="modal-close" id="qr-close" aria-label="Close">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <div class="qr-frame" id="qr-frame"></div>
        <div>
          <div class="qr-caption">Scan to connect to</div>
          <div class="qr-id" id="qr-id"></div>
        </div>
      </div>
    </div>
    <script>
      const CHUNK_SIZE = 16384;
      const MAX_BUFFERED = 1024 * 1024;
      const FRAME_HEADER = 12;
      const READY_TIMEOUT = 60000;
      const SHARE_URL = 'https://tj-db.github.io/root/postbox2.html';

      let peer = null;
      let conn = null;
      let nextFileId = 1;
      let nextKey = 1;
      let hashPeerId = null;
      const outgoing = new Map();
      const partials = new Map();
      const incomingIds = new Map();
      const pendingReady = new Map();
      const items = new Map();
      const objectUrls = [];
      const LEGACY_PEER_ID_KEY = 'postbox-peer-id';
      const SEGMENT_SIZE = CHUNK_SIZE * 64;
      let flushing = Promise.resolve();
      let dbPromise = null;

      function openDb() {
        if (dbPromise) return dbPromise;
        dbPromise = new Promise((resolve) => {
          if (!('indexedDB' in window)) {
            resolve(null);
            return;
          }
          const request = indexedDB.open('postbox', 2);
          request.onupgradeneeded = () => {
            const db = request.result;
            if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'sig' });
            if (!db.objectStoreNames.contains('chunks')) db.createObjectStore('chunks');
            if (!db.objectStoreNames.contains('outgoing')) db.createObjectStore('outgoing', { keyPath: 'sig' });
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => resolve(null);
          request.onblocked = () => resolve(null);
        });
        return dbPromise;
      }

      function transactionDone(tx) {
        return new Promise((resolve) => {
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
          tx.onabort = () => resolve(false);
        });
      }

      function chunkRange(sig, from) {
        return IDBKeyRange.bound([sig, from], [sig, Infinity]);
      }

      function enqueueDb(task) {
        flushing = flushing.then(task).catch(() => {});
        return flushing;
      }

      function saveMeta(info) {
        enqueueDb(async () => {
          const db = await openDb();
          if (!db) return;
          const tx = db.transaction('meta', 'readwrite');
          tx.objectStore('meta').put({ sig: info.sig, name: info.name, size: info.size });
          await transactionDone(tx);
        });
      }

      function deleteMeta(sig) {
        enqueueDb(async () => {
          const db = await openDb();
          if (!db) return;
          const tx = db.transaction('meta', 'readwrite');
          tx.objectStore('meta').delete(sig);
          await transactionDone(tx);
        });
      }

      function saveOutgoing(entry) {
        enqueueDb(async () => {
          const db = await openDb();
          if (!db) return;
          const tx = db.transaction('outgoing', 'readwrite');
          tx.objectStore('outgoing').put({ sig: entry.sig, name: entry.name, size: entry.size });
          await transactionDone(tx);
        });
      }

      function deleteOutgoing(sig) {
        enqueueDb(async () => {
          const db = await openDb();
          if (!db) return;
          const tx = db.transaction('outgoing', 'readwrite');
          tx.objectStore('outgoing').delete(sig);
          await transactionDone(tx);
        });
      }

      async function restoreOutgoing() {
        const db = await openDb();
        if (!db) return;

        const records = await new Promise((resolve) => {
          const request = db.transaction('outgoing').objectStore('outgoing').getAll();
          request.onsuccess = () => resolve(request.result || []);
          request.onerror = () => resolve([]);
        });

        for (const record of records) {
          if (outgoing.has(record.sig)) continue;
          const entry = {
            sig: record.sig,
            name: record.name,
            size: record.size,
            file: null,
            key: `s${nextKey++}`,
            fileId: 0,
            active: false,
            awaiting: false
          };
          outgoing.set(entry.sig, entry);
          addFileToList(entry.key, entry.name, 'Unfinished, choose the file again to resume');
          setSenderActions(entry);
        }
      }

      function createInfo(sig, name, size, fileId) {
        return {
          sig: sig,
          key: `r${nextKey++}`,
          name: name,
          size: size,
          fileId: fileId,
          next: 0,
          stored: new Map(),
          mem: new Map(),
          buf: [],
          bufStart: 0,
          bufBytes: 0,
          crc: 0xFFFFFFFF,
          endCrc: null,
          finishing: false,
          header: 0
        };
      }

      function flushBuffer(info) {
        if (!info.buf.length) return;
        const blob = new Blob(info.buf);
        const offset = info.bufStart;
        info.stored.set(offset, blob.size);
        info.buf = [];
        info.bufBytes = 0;
        info.bufStart = info.next;
        enqueueDb(async () => {
          const db = await openDb();
          if (!db) {
            info.mem.set(offset, blob);
            return;
          }
          const tx = db.transaction('chunks', 'readwrite');
          tx.objectStore('chunks').put(blob, [info.sig, offset]);
          const ok = await transactionDone(tx);
          if (!ok) info.mem.set(offset, blob);
        });
      }

      function flushAllBuffers() {
        partials.forEach((info) => flushBuffer(info));
        return flushing;
      }

      function deleteChunks(sig, from) {
        enqueueDb(async () => {
          const db = await openDb();
          if (!db) return;
          const tx = db.transaction('chunks', 'readwrite');
          tx.objectStore('chunks').delete(chunkRange(sig, from));
          await transactionDone(tx);
        });
      }

      function discardStored(sig) {
        deleteChunks(sig, 0);
        deleteMeta(sig);
      }

      function contiguousPrefix(info) {
        const offsets = Array.from(info.stored.keys()).sort((a, b) => a - b);
        let expected = 0;
        for (const offset of offsets) {
          if (offset !== expected) break;
          const following = expected + info.stored.get(offset);
          if (following % CHUNK_SIZE !== 0 && following !== info.size) break;
          expected = following;
        }
        return expected;
      }

      function trimStored(info, prefix) {
        for (const offset of Array.from(info.stored.keys())) {
          if (offset >= prefix) {
            info.stored.delete(offset);
            info.mem.delete(offset);
          }
        }
        deleteChunks(info.sig, prefix);
      }

      function resetInfo(info) {
        info.stored.clear();
        info.mem.clear();
        info.buf = [];
        info.bufStart = 0;
        info.bufBytes = 0;
        info.next = 0;
        info.crc = 0xFFFFFFFF;
        info.endCrc = null;
        info.finishing = false;
        deleteChunks(info.sig, 0);
      }

      async function rebuildCrc(info, prefix) {
        let crc = 0xFFFFFFFF;
        if (prefix === 0) return crc;
        const db = await openDb();
        const offsets = Array.from(info.stored.keys()).sort((a, b) => a - b);
        for (const offset of offsets) {
          if (offset >= prefix) break;
          let part = info.mem.get(offset) || null;
          if (!part && db) {
            part = await new Promise((resolve) => {
              const request = db.transaction('chunks').objectStore('chunks').get([info.sig, offset]);
              request.onsuccess = () => resolve(request.result || null);
              request.onerror = () => resolve(null);
            });
          }
          if (!part) return null;
          const bytes = part instanceof Blob ? new Uint8Array(await part.arrayBuffer()) : new Uint8Array(part);
          crc = crc32Update(crc, bytes);
        }
        return crc;
      }

      async function collectParts(info) {
        const parts = new Map(info.mem);
        const db = await openDb();
        if (db) {
          await new Promise((resolve) => {
            const request = db.transaction('chunks').objectStore('chunks').openCursor(chunkRange(info.sig, 0));
            request.onsuccess = () => {
              const cursor = request.result;
              if (!cursor) {
                resolve();
                return;
              }
              parts.set(cursor.key[1], cursor.value);
              cursor.continue();
            };
            request.onerror = () => resolve();
          });
        }
        const ordered = [];
        let expected = 0;
        for (const offset of Array.from(parts.keys()).sort((a, b) => a - b)) {
          if (offset !== expected) return null;
          const part = parts.get(offset);
          ordered.push(part);
          expected += part.size !== undefined ? part.size : part.byteLength;
        }
        return expected === info.size ? ordered : null;
      }

      async function restorePartials() {
        const db = await openDb();
        if (!db) return;

        const metas = await new Promise((resolve) => {
          const request = db.transaction('meta').objectStore('meta').getAll();
          request.onsuccess = () => resolve(request.result || []);
          request.onerror = () => resolve([]);
        });

        const known = new Set(metas.map((meta) => meta.sig));
        const orphans = new Set();
        const sizes = new Map();

        await new Promise((resolve) => {
          const request = db.transaction('chunks').objectStore('chunks').openCursor();
          request.onsuccess = () => {
            const cursor = request.result;
            if (!cursor) {
              resolve();
              return;
            }
            const sig = cursor.key[0];
            if (known.has(sig)) {
              if (!sizes.has(sig)) sizes.set(sig, new Map());
              const value = cursor.value;
              sizes.get(sig).set(cursor.key[1], value.size !== undefined ? value.size : value.byteLength);
            } else {
              orphans.add(sig);
            }
            cursor.continue();
          };
          request.onerror = () => resolve();
        });

        orphans.forEach((sig) => deleteChunks(sig, 0));

        for (const meta of metas) {
          if (partials.has(meta.sig)) continue;
          const stored = sizes.get(meta.sig);
          if (!stored || stored.size === 0) {
            discardStored(meta.sig);
            continue;
          }

          const info = createInfo(meta.sig, meta.name, meta.size, 0);
          info.stored = stored;
          const prefix = contiguousPrefix(info);
          trimStored(info, prefix);
          info.next = prefix;
          info.bufStart = prefix;

          partials.set(info.sig, info);
          addFileToList(info.key, info.name, `Restored at ${percent(prefix, info.size)}%, waiting for sender`);
          updateProgress(info.key, percent(prefix, info.size));
          setActions(info.key, receiverActions(info));
        }
      }

      function removeLegacyPeerId() {
        try {
          localStorage.removeItem(LEGACY_PEER_ID_KEY);
        } catch (error) {
          return;
        }
      }

      const crcTable = (() => {
        const table = new Uint32Array(256);
        for (let i = 0; i < 256; i++) {
          let c = i;
          for (let k = 0; k < 8; k++) {
            c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
          }
          table[i] = c >>> 0;
        }
        return table;
      })();

      function crc32Update(crc, bytes) {
        for (let i = 0; i < bytes.length; i++) {
          crc = crcTable[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
        }
        return crc >>> 0;
      }

      function crc32Finish(crc) {
        return (crc ^ 0xFFFFFFFF) >>> 0;
      }

      function generatePeerId() {
        return Math.floor(1000 + Math.random() * 9000).toString();
      }

      function showMessage(text, isError) {
        const el = document.getElementById('message');
        el.textContent = text;
        el.classList.toggle('error', Boolean(isError));
      }

      function showFileTransfer(visible) {
        document.getElementById('file-transfer').style.display = visible ? 'block' : 'none';
      }

      function sleep(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      function sendJson(payload) {
        if (conn && conn.open) {
          conn.send(JSON.stringify(payload));
          return true;
        }
        return false;
      }

      function readHashPeerId() {
        const value = decodeURIComponent(location.hash.slice(1)).trim();
        return /^\d{4}$/.test(value) ? value : null;
      }

      function consumeHashPeerId() {
        if (!hashPeerId) return;
        const target = hashPeerId;
        hashPeerId = null;
        history.replaceState(null, '', location.pathname + location.search);
        document.getElementById('connect-id').value = target;
        connectTo(target);
      }

      function initializePeer() {
        const current = new Peer(generatePeerId());
        peer = current;

        current.on('open', (id) => {
          document.getElementById('peer-id').textContent = id;
          consumeHashPeerId();
        });

        current.on('disconnected', () => {
          setTimeout(() => {
            if (peer === current && current.disconnected && !current.destroyed) current.reconnect();
          }, 1000);
        });

        current.on('connection', (connection) => {
          if (conn && conn.open) {
            connection.on('open', () => connection.close());
            return;
          }
          attachConnection(connection);
        });

        current.on('error', (error) => {
          if (error.type === 'unavailable-id') {
            document.getElementById('peer-id').textContent = 'Connecting...';
            current.destroy();
            initializePeer();
            return;
          }
          if (error.type === 'peer-unavailable') {
            showMessage('No peer found with that ID', true);
          } else {
            showMessage(`Error: ${error.message || error.type}`, true);
          }
        });
      }

      function attachConnection(connection) {
        connection.on('open', () => {
          if (conn && conn !== connection && conn.open) {
            connection.close();
            return;
          }
          conn = connection;
          showMessage('Connected successfully!', false);
          showFileTransfer(true);
          closeQrModal();
        });

        connection.on('data', handleData);

        connection.on('close', () => handleDisconnect(connection));

        connection.on('error', (error) => {
          showMessage(`Connection error: ${error.message || error.type}`, true);
          handleDisconnect(connection);
        });
      }

      function handleDisconnect(connection) {
        if (connection !== conn) return;
        conn = null;

        pendingReady.forEach((resolve) => resolve(null));
        pendingReady.clear();

        incomingIds.forEach((sig) => {
          const info = partials.get(sig);
          if (!info) return;
          flushBuffer(info);
          setStatus(info.key, `Interrupted at ${percent(info.next, info.size)}%`, true);
          setActions(info.key, receiverActions(info));
        });
        incomingIds.clear();

        outgoing.forEach((entry) => {
          if (!entry.awaiting) return;
          entry.awaiting = false;
          setStatus(entry.key, 'Connection lost before confirmation', true);
          setSenderActions(entry);
        });

        showFileTransfer(false);
        showMessage('Connection closed', true);
      }

      function handleData(data) {
        if (typeof data === 'string') {
          let message;
          try {
            message = JSON.parse(data);
          } catch (error) {
            return;
          }
          if (!message || typeof message !== 'object') return;
          switch (message.type) {
            case 'file-header':
              receiveHeader(message);
              break;
            case 'file-ready':
              receiveReady(message);
              break;
            case 'file-end':
              receiveEnd(message);
              break;
            case 'file-result':
              receiveResult(message);
              break;
            case 'resume-request':
              receiveResumeRequest(message);
              break;
            case 'resume-unavailable':
              receiveResumeUnavailable(message);
              break;
            case 'cancel-send':
              receiveCancelSend(message);
              break;
            case 'cancel-receive':
              receiveCancelReceive(message);
              break;
          }
        } else if (data instanceof ArrayBuffer) {
          receiveFrame(data);
        } else if (ArrayBuffer.isView(data)) {
          receiveFrame(data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength));
        }
      }

      function connectToPeer() {
        connectTo(document.getElementById('connect-id').value.trim());
      }

      function connectTo(connectId) {
        if (!peer || !peer.open) {
          showMessage('Still connecting to the server, try again in a moment', true);
          return;
        }
        if (conn && conn.open) {
          showMessage('Already connected', true);
          return;
        }
        if (!/^\d{4}$/.test(connectId)) {
          showMessage('Please enter a valid 4-digit Peer ID', true);
          return;
        }
        if (connectId === peer.id) {
          showMessage('You cannot connect to yourself', true);
          return;
        }
        showMessage('Connecting...', false);
        attachConnection(peer.connect(connectId, { reliable: true, serialization: 'raw' }));
      }

      function openQrModal() {
        if (!peer || !peer.open || !peer.id) {
          showMessage('Still connecting to the server, try again in a moment', true);
          return;
        }
        const qr = qrcode(0, 'M');
        qr.addData(`${SHARE_URL}#${encodeURIComponent(peer.id)}`);
        qr.make();
        const img = document.createElement('img');
        img.alt = 'QR code';
        img.src = qr.createDataURL(8, 0);
        document.getElementById('qr-frame').replaceChildren(img);
        document.getElementById('qr-id').textContent = peer.id;
        document.getElementById('qr-modal').classList.add('open');
      }

      function closeQrModal() {
        document.getElementById('qr-modal').classList.remove('open');
      }

      function percent(done, total) {
        return total ? Math.min(100, Math.round((done / total) * 100)) : 100;
      }

      function addFileToList(key, fileName, statusText) {
        const li = document.createElement('li');
        li.className = 'file-item';

        const info = document.createElement('div');
        info.className = 'file-info';

        const name = document.createElement('div');
        name.className = 'file-name';
        name.textContent = fileName;

        const status = document.createElement('div');
        status.className = 'file-status';
        status.textContent = statusText;

        const bar = document.createElement('div');
        bar.className = 'progress-bar';

        const progress = document.createElement('div');
        progress.className = 'progress';
        bar.appendChild(progress);

        info.append(name, status, bar);

        const actions = document.createElement('div');
        actions.className = 'file-actions';

        li.append(info, actions);
        document.getElementById('file-list').appendChild(li);
        items.set(key, { li, progress, status, actions });
      }

      function updateProgress(key, value) {
        const item = items.get(key);
        if (item) item.progress.style.width = `${Math.min(100, value)}%`;
      }

      function setStatus(key, text, isError) {
        const item = items.get(key);
        if (!item) return;
        item.status.textContent = text;
        item.status.classList.toggle('error', Boolean(isError));
      }

      function clearActions(key) {
        const item = items.get(key);
        if (item) item.actions.replaceChildren();
      }

      function setActions(key, buttons) {
        const item = items.get(key);
        if (!item) return;
        item.actions.replaceChildren();
        for (const spec of buttons) {
          const button = document.createElement('button');
          button.textContent = spec.label;
          if (spec.secondary) button.className = 'secondary';
          button.addEventListener('click', spec.handler);
          item.actions.appendChild(button);
        }
      }

      function removeItem(key) {
        const item = items.get(key);
        if (!item) return;
        item.li.remove();
        items.delete(key);
      }

      function setSenderActions(entry) {
        setActions(entry.key, [
          { label: 'Resume', handler: () => startTransfer(entry, false) },
          { label: 'Resend', secondary: true, handler: () => startTransfer(entry, true) },
          { label: 'Cancel', secondary: true, handler: () => cancelSend(entry, true) }
        ]);
      }

      function receiverActions(info) {
        return [
          { label: 'Request resume', handler: () => requestResume(info.sig, false) },
          { label: 'Request resend', secondary: true, handler: () => requestResume(info.sig, true) },
          { label: 'Cancel', secondary: true, handler: () => cancelReceive(info, true) }
        ];
      }

      let pickTarget = null;

      function pickFile(entry, restart) {
        pickTarget = { entry: entry, restart: Boolean(restart) };
        document.getElementById('resume-input').click();
      }

      function cancelSend(entry, notify) {
        if (entry.active) return;
        outgoing.delete(entry.sig);
        deleteOutgoing(entry.sig);
        removeItem(entry.key);
        if (notify) sendJson({ type: 'cancel-send', sig: entry.sig });
      }

      function cancelReceive(info, notify) {
        incomingIds.delete(info.fileId);
        partials.delete(info.sig);
        discardStored(info.sig);
        removeItem(info.key);
        if (notify) sendJson({ type: 'cancel-receive', sig: info.sig });
      }

      async function waitForBuffer(connection) {
        const channel = connection.dataChannel;
        if (!channel) return;
        while (connection.open && channel.bufferedAmount > MAX_BUFFERED) {
          await sleep(50);
        }
      }

      function waitForReady(fileId) {
        return new Promise((resolve) => {
          const timer = setTimeout(() => {
            pendingReady.delete(fileId);
            resolve(null);
          }, READY_TIMEOUT);
          pendingReady.set(fileId, (offset) => {
            clearTimeout(timer);
            pendingReady.delete(fileId);
            resolve(offset);
          });
        });
      }

      function signatureOf(file) {
        return `${file.name}|${file.size}|${file.lastModified}`;
      }

      function getOrCreateEntry(file) {
        const sig = signatureOf(file);
        let entry = outgoing.get(sig);
        if (entry) {
          entry.file = file;
          return entry;
        }
        entry = {
          sig: sig,
          name: file.name,
          size: file.size,
          file: file,
          key: `s${nextKey++}`,
          fileId: 0,
          active: false,
          awaiting: false
        };
        outgoing.set(sig, entry);
        saveOutgoing(entry);
        addFileToList(entry.key, file.name, 'Waiting...');
        return entry;
      }

      async function startTransfer(entry, restart) {
        const connection = conn;
        if (!connection || !connection.open) {
          showMessage('Please connect to a peer first', true);
          return;
        }
        if (entry.active) return;
        if (!entry.file) {
          pickFile(entry, restart);
          return;
        }

        entry.active = true;
        entry.awaiting = false;
        const key = entry.key;
        const file = entry.file;
        const fileId = nextFileId++;
        entry.fileId = fileId;

        clearActions(key);
        setStatus(key, 'Negotiating...');

        let offset = 0;
        try {
          const ready = waitForReady(fileId);
          connection.send(JSON.stringify({
            type: 'file-header',
            fileId: fileId,
            sig: entry.sig,
            fileName: file.name,
            fileSize: file.size,
            restart: Boolean(restart)
          }));

          const granted = await ready;
          if (granted === null) throw new Error('No response');

          let start = Math.max(0, Math.min(Number(granted) || 0, file.size));
          if (start < file.size) start -= start % CHUNK_SIZE;

          let crc = 0xFFFFFFFF;
          for (let skipped = 0; skipped < start; skipped += CHUNK_SIZE) {
            if (!connection.open || connection !== conn) throw new Error('Connection lost');
            const end = Math.min(skipped + CHUNK_SIZE, start);
            crc = crc32Update(crc, new Uint8Array(await file.slice(skipped, end).arrayBuffer()));
          }

          offset = start;
          updateProgress(key, percent(offset, file.size));
          setStatus(key, start > 0 ? `Resuming from ${percent(offset, file.size)}%...` : 'Sending...');

          while (offset < file.size) {
            if (!connection.open || connection !== conn) {
              throw new Error('Connection lost');
            }
            await waitForBuffer(connection);
            const payload = new Uint8Array(await file.slice(offset, offset + CHUNK_SIZE).arrayBuffer());
            const frame = new Uint8Array(FRAME_HEADER + payload.byteLength);
            const view = new DataView(frame.buffer);
            view.setUint32(0, fileId);
            view.setFloat64(4, offset);
            frame.set(payload, FRAME_HEADER);
            crc = crc32Update(crc, payload);
            connection.send(frame.buffer);
            offset += payload.byteLength;
            updateProgress(key, percent(offset, file.size));
          }

          connection.send(JSON.stringify({
            type: 'file-end',
            fileId: fileId,
            crc: crc32Finish(crc)
          }));
          entry.awaiting = true;
          updateProgress(key, 100);
          setStatus(key, 'Sent, waiting for confirmation...');
        } catch (error) {
          setStatus(key, `Interrupted at ${percent(offset, file.size)}%`, true);
          setSenderActions(entry);
        } finally {
          entry.active = false;
        }
      }

      async function receiveHeader(data) {
        if (!Number.isInteger(data.fileId) || typeof data.sig !== 'string') return;
        const size = Number(data.fileSize);
        if (!Number.isFinite(size) || size < 0) return;
        const name = typeof data.fileName === 'string' && data.fileName ? data.fileName : 'file';

        let info = partials.get(data.sig);
        if (info && info.size !== size) {
          setStatus(info.key, 'Superseded', true);
          clearActions(info.key);
          incomingIds.delete(info.fileId);
          partials.delete(data.sig);
          discardStored(data.sig);
          info = null;
        }

        if (!info) {
          info = createInfo(data.sig, name, size, data.fileId);
          partials.set(data.sig, info);
          saveMeta(info);
          addFileToList(info.key, name, 'Preparing...');
        } else if (data.restart) {
          resetInfo(info);
        }

        incomingIds.delete(info.fileId);
        info.fileId = data.fileId;
        info.endCrc = null;
        info.finishing = false;
        info.header += 1;
        const token = info.header;

        clearActions(info.key);
        setStatus(info.key, 'Preparing...');

        flushBuffer(info);
        await flushing;
        if (partials.get(info.sig) !== info || info.header !== token) return;

        const prefix = contiguousPrefix(info);
        trimStored(info, prefix);

        let start = prefix;
        let crc = await rebuildCrc(info, prefix);
        if (partials.get(info.sig) !== info || info.header !== token) return;
        if (crc === null) {
          resetInfo(info);
          start = 0;
          crc = 0xFFFFFFFF;
        }

        info.next = start;
        info.bufStart = start;
        info.buf = [];
        info.bufBytes = 0;
        info.crc = crc;
        incomingIds.set(data.fileId, info.sig);

        updateProgress(info.key, percent(start, info.size));
        setStatus(info.key, start > 0 ? `Resuming from ${percent(start, info.size)}%...` : 'Receiving...');

        sendJson({ type: 'file-ready', fileId: data.fileId, offset: start });
      }

      function receiveReady(data) {
        const resolve = pendingReady.get(data.fileId);
        if (resolve) resolve(Number(data.offset) || 0);
      }

      function receiveFrame(buffer) {
        if (buffer.byteLength <= FRAME_HEADER) return;
        const view = new DataView(buffer);
        const fileId = view.getUint32(0);
        const offset = view.getFloat64(4);
        const sig = incomingIds.get(fileId);
        const info = sig === undefined ? null : partials.get(sig);
        if (!info || info.fileId !== fileId) return;

        const length = buffer.byteLength - FRAME_HEADER;
        if (!(offset >= 0) || offset + length > info.size) {
          failReceive(info, 'Corrupted, please resend');
          return;
        }
        if (offset < info.next) return;
        if (offset > info.next) {
          failReceive(info, `Out of order (expected ${info.next}, got ${offset}), please resend`);
          return;
        }

        const payload = new Uint8Array(buffer, FRAME_HEADER, length);
        info.crc = crc32Update(info.crc, payload);
        if (info.buf.length === 0) info.bufStart = offset;
        info.buf.push(payload);
        info.bufBytes += length;
        info.next += length;
        if (info.bufBytes >= SEGMENT_SIZE) flushBuffer(info);

        updateProgress(info.key, percent(info.next, info.size));
        tryFinish(info);
      }

      function receiveEnd(data) {
        const sig = incomingIds.get(data.fileId);
        const info = sig === undefined ? null : partials.get(sig);
        if (!info) return;
        info.endCrc = Number(data.crc);
        tryFinish(info);
      }

      function findEntryByFileId(fileId) {
        for (const entry of outgoing.values()) {
          if (entry.fileId === fileId) return entry;
        }
        return null;
      }

      function receiveResult(data) {
        const entry = findEntryByFileId(data.fileId);
        if (!entry) return;
        entry.awaiting = false;
        if (data.ok) {
          setStatus(entry.key, 'Delivered');
          clearActions(entry.key);
          deleteOutgoing(entry.sig);
        } else {
          setStatus(entry.key, 'Corrupted on receiver, please resend', true);
          setActions(entry.key, [
            { label: 'Resend', handler: () => startTransfer(entry, true) },
            { label: 'Cancel', secondary: true, handler: () => cancelSend(entry, true) }
          ]);
        }
      }

      function receiveResumeRequest(data) {
        const entry = typeof data.sig === 'string' ? outgoing.get(data.sig) : null;
        if (!entry) {
          sendJson({ type: 'resume-unavailable', sig: data.sig });
          return;
        }
        if (!entry.file) {
          setStatus(entry.key, 'Receiver asked to resume, choose the file to continue', true);
          setSenderActions(entry);
          return;
        }
        startTransfer(entry, Boolean(data.restart));
      }

      function receiveResumeUnavailable(data) {
        const info = partials.get(data.sig);
        if (!info) return;
        setStatus(info.key, 'Sender no longer has this file', true);
        setActions(info.key, [
          { label: 'Cancel', secondary: true, handler: () => cancelReceive(info, false) }
        ]);
      }

      function receiveCancelSend(data) {
        const info = typeof data.sig === 'string' ? partials.get(data.sig) : null;
        if (!info) return;
        incomingIds.delete(info.fileId);
        partials.delete(info.sig);
        discardStored(info.sig);
        updateProgress(info.key, 0);
        setStatus(info.key, 'Cancelled by sender', true);
        setActions(info.key, [
          { label: 'Dismiss', secondary: true, handler: () => removeItem(info.key) }
        ]);
      }

      function receiveCancelReceive(data) {
        const entry = typeof data.sig === 'string' ? outgoing.get(data.sig) : null;
        if (!entry || entry.active) return;
        entry.awaiting = false;
        setStatus(entry.key, 'Cancelled by receiver', true);
        setActions(entry.key, [
          { label: 'Resend', handler: () => startTransfer(entry, true) },
          { label: 'Dismiss', secondary: true, handler: () => cancelSend(entry, false) }
        ]);
      }

      function requestResume(sig, restart) {
        if (!sendJson({ type: 'resume-request', sig: sig, restart: Boolean(restart) })) {
          showMessage('Please connect to a peer first', true);
        }
      }

      function reportResult(fileId, ok) {
        sendJson({ type: 'file-result', fileId: fileId, ok: ok });
      }

      function failReceive(info, text) {
        incomingIds.delete(info.fileId);
        resetInfo(info);
        updateProgress(info.key, 0);
        setStatus(info.key, text, true);
        setActions(info.key, [
          { label: 'Request resend', handler: () => requestResume(info.sig, true) },
          { label: 'Cancel', secondary: true, handler: () => cancelReceive(info, true) }
        ]);
        reportResult(info.fileId, false);
      }

      async function tryFinish(info) {
        if (info.finishing || info.endCrc === null || info.next < info.size) return;
        info.finishing = true;

        flushBuffer(info);
        setStatus(info.key, 'Finishing...');
        await flushing;
        if (partials.get(info.sig) !== info) return;

        if (crc32Finish(info.crc) !== info.endCrc) {
          failReceive(info, 'Corrupted, please resend');
          return;
        }

        const parts = await collectParts(info);
        if (partials.get(info.sig) !== info) return;
        if (!parts) {
          failReceive(info, 'Storage error, please resend');
          return;
        }

        partials.delete(info.sig);
        incomingIds.delete(info.fileId);
        deleteMeta(info.sig);

        const blob = new Blob(parts, { type: 'application/octet-stream' });
        info.mem.clear();
        info.stored.clear();
        const url = URL.createObjectURL(blob);
        objectUrls.push(url);

        updateProgress(info.key, 100);
        setStatus(info.key, 'Received, tap Save to download');
        reportResult(info.fileId, true);

        const link = document.createElement('a');
        link.href = url;
        link.download = info.name;
        link.rel = 'noopener';
        link.textContent = 'Save';

        clearActions(info.key);
        const item = items.get(info.key);
        if (item) item.actions.appendChild(link);
      }

      document.getElementById('connect-btn').addEventListener('click', connectToPeer);

      document.getElementById('connect-id').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') connectToPeer();
      });

      document.getElementById('qr-btn').addEventListener('click', openQrModal);

      document.getElementById('qr-close').addEventListener('click', closeQrModal);

      document.getElementById('qr-modal').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) closeQrModal();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeQrModal();
      });

      window.addEventListener('hashchange', () => {
        const id = readHashPeerId();
        if (!id) return;
        hashPeerId = id;
        if (peer && peer.open) consumeHashPeerId();
      });

      document.getElementById('select-files').addEventListener('click', () => {
        document.getElementById('file-input').click();
      });

      document.getElementById('file-input').addEventListener('change', async (e) => {
        const connection = conn;
        if (!connection || !connection.open) {
          showMessage('Please connect to a peer first', true);
          e.target.value = '';
          return;
        }

        const files = Array.from(e.target.files);
        e.target.value = '';

        for (const file of files) {
          if (!connection.open || connection !== conn) break;
          await startTransfer(getOrCreateEntry(file), false);
        }
      });

      document.getElementById('resume-input').addEventListener('change', async (e) => {
        const target = pickTarget;
        pickTarget = null;
        const file = e.target.files[0];
        e.target.value = '';
        if (!target || !file) return;
        if (signatureOf(file) !== target.entry.sig) {
          showMessage('That is not the same file: name, size and modified date must match', true);
          return;
        }
        target.entry.file = file;
        await startTransfer(target.entry, target.restart);
      });

      document.getElementById('refresh-btn').addEventListener('click', () => {
        location.reload();
      });

      async function resetAll() {
        if (!confirm('Clear all stored data? This removes unfinished transfers.')) return;

        partials.forEach((info) => {
          info.buf = [];
        });

        if (conn) {
          const connection = conn;
          conn = null;
          try {
            connection.close();
          } catch (error) {
            showMessage('Connection closed', true);
          }
        }

        try {
          await flushing;
        } catch (error) {
          showMessage('Clearing storage', false);
        }

        const db = await openDb();
        if (db) db.close();

        await new Promise((resolve) => {
          if (!('indexedDB' in window)) {
            resolve();
            return;
          }
          const request = indexedDB.deleteDatabase('postbox');
          request.onsuccess = () => resolve();
          request.onerror = () => resolve();
          request.onblocked = () => resolve();
        });

        removeLegacyPeerId();

        objectUrls.splice(0).forEach((url) => URL.revokeObjectURL(url));
        location.reload();
      }

      document.getElementById('reset-btn').addEventListener('click', resetAll);

      window.addEventListener('pagehide', (e) => {
        flushAllBuffers();
        if (!e.persisted) objectUrls.splice(0).forEach((url) => URL.revokeObjectURL(url));
      });

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') flushAllBuffers();
      });

      if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persist().catch(() => {});
      }

      removeLegacyPeerId();
      hashPeerId = readHashPeerId();
      restorePartials();
      restoreOutgoing();
      initializePeer();

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations()
          .then((registrations) => Promise.all(registrations.map((registration) => registration.unregister())))
          .catch(() => {});
      }

      if ('caches' in window) {
        caches.keys()
          .then((names) => Promise.all(names.map((name) => caches.delete(name))))
          .catch(() => {});
      }
    </script>
  </body>
</html>
