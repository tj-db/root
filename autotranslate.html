<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Subtitles · English / 繁體中文</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07090c;
  --panel: #12161c;
  --line: #262d38;
  --text: #f4f1e8;
  --muted: #8892a2;
  --en: #ffffff;
  --zh: #ffd24a;
  --live: #ff4d4d;
  --font: "Inter", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  display: flex;
  flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--line);
}
.bar h1 {
  font-size: 1rem;
  font-weight: 700;
  margin: 0 auto 0 0;
  letter-spacing: 0.01em;
}
.bar label { color: var(--muted); font-size: 0.875rem; display: flex; align-items: center; gap: 8px; }
select, button {
  font: inherit;
  font-size: 0.9375rem;
  color: var(--text);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px 14px;
}
button { cursor: pointer; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }
button:hover { border-color: var(--muted); }
select:focus-visible, button:focus-visible { outline: 2px solid var(--zh); outline-offset: 2px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
button.on .dot { background: var(--live); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.35; } }
@media (prefers-reduced-motion: reduce) { button.on .dot { animation: none; } }
.stage {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: clamp(20px, 5vh, 56px);
  padding: clamp(20px, 5vw, 72px);
  max-width: 1400px;
  width: 100%;
  margin: 0 auto;
  overflow: hidden;
}
.line {
  margin: 0;
  font-weight: 700;
  line-height: 1.3;
  font-size: clamp(1.6rem, 4.6vw, 3.6rem);
  min-height: 2.6em;
  overflow-wrap: anywhere;
}
.line.en { color: var(--en); }
.line.zh { color: var(--zh); letter-spacing: 0.04em; }
.line.interim { opacity: 0.6; }
.status {
  padding: 12px 20px;
  color: var(--muted);
  font-size: 0.875rem;
  border-top: 1px solid var(--line);
  min-height: 2.8em;
}
.status.err { color: #ff8a8a; }
</style>
</head>
<body>
<div class="bar">
  <h1>Live Subtitles</h1>
  <label>I'm speaking
    <select id="lang">
      <option value="en">English</option>
      <option value="zh">中文</option>
    </select>
  </label>
  <label>Accent
    <select id="accent"></select>
  </label>
  <button id="toggle" type="button"><span class="dot"></span><span id="toggleText">Start listening</span></button>
</div>
<main class="stage" aria-live="polite">
  <p class="line en" id="en" lang="en"></p>
  <p class="line zh" id="zh" lang="zh-Hant"></p>
</main>
<div class="status" id="status">Press Start listening and allow microphone access.</div>

<script>
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const enEl = document.getElementById("en");
const zhEl = document.getElementById("zh");
const statusEl = document.getElementById("status");
const toggleBtn = document.getElementById("toggle");
const toggleText = document.getElementById("toggleText");
const langSel = document.getElementById("lang");

const accentSel = document.getElementById("accent");
const ACCENTS = {
  en: [
    ["en-US", "US"],
    ["en-GB", "UK"],
    ["en-SG", "Singapore"],
    ["en-HK", "Hong Kong"],
    ["en-IN", "India"],
    ["en-AU", "Australia"],
    ["en-PH", "Philippines"]
  ],
  zh: [
    ["zh-TW", "台灣國語"],
    ["zh-HK", "粵語 (香港)"]
  ]
};

function populateAccents() {
  accentSel.innerHTML = "";
  ACCENTS[langSel.value].forEach(([code, label]) => {
    const opt = document.createElement("option");
    opt.value = code;
    opt.textContent = label;
    accentSel.appendChild(opt);
  });
}
populateAccents();

let rec = null;
let running = false;
let seq = 0;
let debounceTimer = null;
let clearTimer = null;
let nativeTranslator = null;
let nativeKey = "";

function setStatus(msg, isErr) {
  statusEl.textContent = msg;
  statusEl.classList.toggle("err", !!isErr);
}

async function getNativeTranslator(from) {
  if (!("Translator" in self)) return null;
  const source = from === "en" ? "en" : "zh-Hant";
  const target = from === "en" ? "zh-Hant" : "en";
  const key = source + ">" + target;
  if (nativeKey === key && nativeTranslator) return nativeTranslator;
  try {
    const avail = await Translator.availability({ sourceLanguage: source, targetLanguage: target });
    if (avail === "unavailable") return null;
    nativeTranslator = await Translator.create({ sourceLanguage: source, targetLanguage: target });
    nativeKey = key;
    return nativeTranslator;
  } catch (e) {
    return null;
  }
}

async function translate(text, from) {
  const native = await getNativeTranslator(from);
  if (native) {
    try {
      return await native.translate(text);
    } catch (e) {}
  }
  const pair = from === "en" ? "en|zh-TW" : "zh-TW|en";
  const url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text.slice(0, 480)) + "&langpair=" + encodeURIComponent(pair);
  const res = await fetch(url);
  if (!res.ok) throw new Error("Translation service returned " + res.status);
  const data = await res.json();
  return data.responseData.translatedText;
}

function render(source, translated, from, interim) {
  const srcEl = from === "en" ? enEl : zhEl;
  const dstEl = from === "en" ? zhEl : enEl;
  srcEl.textContent = source;
  if (translated !== null) dstEl.textContent = translated;
  enEl.classList.toggle("interim", interim);
  zhEl.classList.toggle("interim", interim);
}

async function run(text, from, interim, mySeq) {
  try {
    const out = await translate(text, from);
    if (mySeq !== seq) return;
    render(text, out, from, interim);
  } catch (e) {
    if (mySeq !== seq) return;
    setStatus("Translation failed. Check your internet connection.", true);
  }
}

function handleResult(event) {
  const from = langSel.value;
  const result = event.results[event.results.length - 1];
  const text = result[0].transcript.trim();
  if (!text) return;
  const interim = !result.isFinal;
  const mySeq = ++seq;
  clearTimeout(clearTimer);
  clearTimeout(debounceTimer);
  render(text, null, from, interim);
  if (interim) {
    debounceTimer = setTimeout(() => run(text, from, true, mySeq), 350);
  } else {
    run(text, from, false, mySeq);
    clearTimer = setTimeout(() => {
      enEl.textContent = "";
      zhEl.textContent = "";
    }, 9000);
  }
}

function buildRecognizer() {
  const r = new SR();
  r.continuous = true;
  r.interimResults = true;
  r.lang = accentSel.value;
  r.onresult = handleResult;
  r.onerror = (e) => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      running = false;
      updateButton();
      setStatus("Microphone access was blocked. Allow it in your browser's site settings, and open this page over https or localhost.", true);
    } else if (e.error === "audio-capture") {
      running = false;
      updateButton();
      setStatus("No microphone was found.", true);
    } else if (e.error === "network") {
      setStatus("Speech recognition lost its network connection.", true);
    }
  };
  r.onend = () => {
    if (running) {
      try { r.start(); } catch (e) {}
    }
  };
  return r;
}

function updateButton() {
  toggleBtn.classList.toggle("on", running);
  toggleText.textContent = running ? "Stop listening" : "Start listening";
}

function start() {
  rec = buildRecognizer();
  running = true;
  updateButton();
  try {
    rec.start();
    setStatus("Listening in " + (langSel.value === "en" ? "English" : "中文") + "…");
  } catch (e) {
    setStatus("Could not start the microphone.", true);
  }
  getNativeTranslator(langSel.value);
}

function stop() {
  running = false;
  updateButton();
  if (rec) { try { rec.stop(); } catch (e) {} }
  setStatus("Stopped.");
}

toggleBtn.addEventListener("click", () => (running ? stop() : start()));

function restartIfRunning() {
  enEl.textContent = "";
  zhEl.textContent = "";
  seq++;
  if (running) {
    const old = rec;
    old.onend = null;
    try { old.abort(); } catch (e) {}
    start();
  }
}

langSel.addEventListener("change", () => {
  populateAccents();
  restartIfRunning();
});

accentSel.addEventListener("change", restartIfRunning);

if (!SR) {
  toggleBtn.disabled = true;
  setStatus("This browser does not support speech recognition. Use Chrome, Edge, or Safari.", true);
}
</script>
</body>
</html>
