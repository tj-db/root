<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icons/512x512.png">
    <title>POSTBOX</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <style>
      :root {
        --bg-primary: #1a1a1a;
        --text-primary: #ffffff;
        --accent: #4CAF50;
        --error: #ff4444;
        --card-bg: #2d2d2d;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      body {
        background-color: var(--bg-primary);
        color: var(--text-primary);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 2rem;
      }
      .container {
        max-width: 800px;
        width: 100%;
        background-color: var(--card-bg);
        padding: 2rem;
        border-radius: 22px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      h1 {
        margin-bottom: 2rem;
        color: var(--accent);
        font-size: 3.3rem;
      }
      .status {
        margin-bottom: 2rem;
      }
      .peer-id {
        font-size: 2rem;
        font-weight: bold;
        margin: 1rem 0;
        margin-bottom: 1rem;
        color: var(--accent);
      }
      .connect-form {
        display: flex;
        gap: 1rem;
        justify-content: center;
        margin-bottom: 1rem;
      }
      input, button {
        padding: 0.5rem 1rem;
        border: none;
        border-radius: 16px;
        font-size: 1rem;
      }
      input {
        background-color: #333;
        color: var(--text-primary);
      }
      button {
        background-color: var(--accent);
        color: white;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      button:hover {
        opacity: 0.9;
      }
      .message {
        min-height: 1.5rem;
        margin: 0.5rem 0 1rem;
        color: var(--accent);
      }
      .message.error {
        color: var(--error);
      }
      .file-transfer {
        display: none;
        margin-top: 1rem;
      }
      .file-list {
        margin-top: 1rem;
        list-style: none;
      }
      .file-item {
        background-color: #333;
        padding: 1rem;
        margin-bottom: 0.5rem;
        border-radius: 11px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        text-align: left;
      }
      .file-info {
        flex: 1;
        min-width: 0;
      }
      .file-name {
        word-break: break-all;
      }
      .file-status {
        font-size: 0.8rem;
        opacity: 0.7;
        margin-top: 0.2rem;
      }
      .file-actions a {
        display: inline-block;
        padding: 0.5rem 1rem;
        border-radius: 16px;
        background-color: var(--accent);
        color: white;
        text-decoration: none;
        font-size: 0.9rem;
      }
      .progress-bar {
        height: 5px;
        background-color: #444;
        border-radius: 5px;
        overflow: hidden;
        margin-top: 0.5rem;
      }
      .progress {
        height: 100%;
        background-color: var(--accent);
        width: 0%;
        transition: width 0.3s;
      }
      #refresh-btn {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        padding: 1rem;
        background-color: transparent;
        border: none;
        border-radius: 50%;
        cursor: pointer;
        font-size: 2.2rem;
        transition: transform 1.1s ease, opacity 0.2s;
      }
      #refresh-btn:hover {
        opacity: 0.9;
        transform: rotate(360deg);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>POSTBOX</h1>
      <div id="host-section">
        <div class="status"></div>
        <div class="peer-id" id="peer-id">Connecting...</div>
      </div>
      <div id="connect-section">
        <div class="connect-form">
          <input type="text" id="connect-id" placeholder="Connect to ID no." maxlength="4" inputmode="numeric" pattern="\d{4}">
          <button id="connect-btn">Join</button>
        </div>
      </div>
      <div id="message" class="message" role="status" aria-live="polite"></div>
      <div class="file-transfer" id="file-transfer">
        <input type="file" id="file-input" multiple style="display: none">
        <button id="select-files">Select Files</button>
        <ul class="file-list" id="file-list"></ul>
      </div>
      <button id="refresh-btn" aria-label="Refresh">
        <i class="fa fa-refresh" style="color: var(--accent);"></i>
      </button>
    </div>
    <script>
      const CHUNK_SIZE = 16384;
      const MAX_BUFFERED = 1024 * 1024;

      let peer = null;
      let conn = null;
      const incoming = new Map();
      const items = new Map();
      const objectUrls = [];

      function generatePeerId() {
        return Math.floor(1000 + Math.random() * 9000).toString();
      }

      function showMessage(text, isError) {
        const el = document.getElementById('message');
        el.textContent = text;
        el.classList.toggle('error', Boolean(isError));
      }

      function showFileTransfer(visible) {
        document.getElementById('file-transfer').style.display = visible ? 'block' : 'none';
      }

      function sleep(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      function initializePeer() {
        const peerId = generatePeerId();
        peer = new Peer(peerId);

        peer.on('open', (id) => {
          document.getElementById('peer-id').textContent = id;
        });

        peer.on('connection', (connection) => {
          if (conn && conn.open) {
            connection.on('open', () => connection.close());
            return;
          }
          attachConnection(connection);
        });

        peer.on('error', (error) => {
          if (error.type === 'peer-unavailable') {
            showMessage('No peer found with that ID', true);
          } else {
            showMessage(`Error: ${error.message || error.type}`, true);
          }
        });
      }

      function attachConnection(connection) {
        connection.on('open', () => {
          if (conn && conn !== connection && conn.open) {
            connection.close();
            return;
          }
          conn = connection;
          showMessage('Connected successfully!', false);
          showFileTransfer(true);
        });

        connection.on('data', handleData);

        connection.on('close', () => handleDisconnect(connection));

        connection.on('error', (error) => {
          showMessage(`Connection error: ${error.message || error.type}`, true);
          handleDisconnect(connection);
        });
      }

      function handleDisconnect(connection) {
        if (connection !== conn) return;
        conn = null;
        incoming.clear();
        items.clear();
        document.getElementById('file-list').replaceChildren();
        objectUrls.splice(0).forEach((url) => URL.revokeObjectURL(url));
        showFileTransfer(false);
        showMessage('Connection closed', true);
      }

      function handleData(data) {
        if (!data || typeof data !== 'object') return;
        if (data.type === 'file-header') {
          receiveHeader(data);
        } else if (data.type === 'file-chunk') {
          receiveChunk(data);
        }
      }

      function connectToPeer() {
        if (!peer || !peer.open) {
          showMessage('Still connecting to the server, try again in a moment', true);
          return;
        }
        if (conn && conn.open) {
          showMessage('Already connected', true);
          return;
        }
        const connectId = document.getElementById('connect-id').value.trim();
        if (!/^\d{4}$/.test(connectId)) {
          showMessage('Please enter a valid 4-digit Peer ID', true);
          return;
        }
        if (connectId === peer.id) {
          showMessage('You cannot connect to yourself', true);
          return;
        }
        showMessage('Connecting...', false);
        attachConnection(peer.connect(connectId, { reliable: true }));
      }

      function addFileToList(fileId, fileName, statusText) {
        const li = document.createElement('li');
        li.className = 'file-item';

        const info = document.createElement('div');
        info.className = 'file-info';

        const name = document.createElement('div');
        name.className = 'file-name';
        name.textContent = fileName;

        const status = document.createElement('div');
        status.className = 'file-status';
        status.textContent = statusText;

        const bar = document.createElement('div');
        bar.className = 'progress-bar';

        const progress = document.createElement('div');
        progress.className = 'progress';
        bar.appendChild(progress);

        info.append(name, status, bar);

        const actions = document.createElement('div');
        actions.className = 'file-actions';

        li.append(info, actions);
        document.getElementById('file-list').appendChild(li);
        items.set(fileId, { progress, status, actions });
      }

      function updateProgress(fileId, percent) {
        const item = items.get(fileId);
        if (item) item.progress.style.width = `${Math.min(100, percent)}%`;
      }

      function setStatus(fileId, text) {
        const item = items.get(fileId);
        if (item) item.status.textContent = text;
      }

      async function waitForBuffer(connection) {
        const channel = connection.dataChannel;
        if (!channel) return;
        while (connection.open && channel.bufferedAmount > MAX_BUFFERED) {
          await sleep(50);
        }
      }

      async function sendFile(file, connection) {
        const fileId = Math.random().toString(36).slice(2, 11);

        connection.send({
          type: 'file-header',
          fileId: fileId,
          fileName: file.name,
          fileSize: file.size
        });

        addFileToList(fileId, file.name, 'Sending...');

        let offset = 0;
        try {
          while (offset < file.size) {
            if (!connection.open || connection !== conn) {
              throw new Error('Connection lost');
            }
            await waitForBuffer(connection);
            const buffer = await file.slice(offset, offset + CHUNK_SIZE).arrayBuffer();
            connection.send({
              type: 'file-chunk',
              fileId: fileId,
              chunk: buffer,
              offset: offset
            });
            offset += buffer.byteLength;
            updateProgress(fileId, (offset / file.size) * 100);
          }
          updateProgress(fileId, 100);
          setStatus(fileId, 'Sent');
        } catch (error) {
          setStatus(fileId, 'Failed');
        }
      }

      function receiveHeader(data) {
        if (typeof data.fileId !== 'string' || incoming.has(data.fileId)) return;
        const name = typeof data.fileName === 'string' && data.fileName ? data.fileName : 'file';
        const size = Number(data.fileSize);
        if (!Number.isFinite(size) || size < 0) return;

        incoming.set(data.fileId, { chunks: [], name: name, size: size, received: 0 });
        addFileToList(data.fileId, name, 'Receiving...');

        if (size === 0) finishReceive(data.fileId);
      }

      function receiveChunk(data) {
        const fileInfo = incoming.get(data.fileId);
        if (!fileInfo || !data.chunk) return;

        fileInfo.chunks.push(data.chunk);
        fileInfo.received += data.chunk.byteLength;

        updateProgress(data.fileId, (fileInfo.received / fileInfo.size) * 100);

        if (fileInfo.received >= fileInfo.size) {
          finishReceive(data.fileId);
        }
      }

      function finishReceive(fileId) {
        const fileInfo = incoming.get(fileId);
        const item = items.get(fileId);
        if (!fileInfo) return;
        incoming.delete(fileId);

        const blob = new Blob(fileInfo.chunks);
        const url = URL.createObjectURL(blob);
        objectUrls.push(url);

        updateProgress(fileId, 100);
        setStatus(fileId, 'Received');

        const link = document.createElement('a');
        link.href = url;
        link.download = fileInfo.name;
        link.textContent = 'Save';

        if (item) item.actions.appendChild(link);

        link.click();
      }

      document.getElementById('connect-btn').addEventListener('click', connectToPeer);

      document.getElementById('connect-id').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') connectToPeer();
      });

      document.getElementById('select-files').addEventListener('click', () => {
        document.getElementById('file-input').click();
      });

      document.getElementById('file-input').addEventListener('change', async (e) => {
        const connection = conn;
        if (!connection || !connection.open) {
          showMessage('Please connect to a peer first', true);
          e.target.value = '';
          return;
        }

        const files = Array.from(e.target.files);
        e.target.value = '';

        for (const file of files) {
          if (!connection.open || connection !== conn) break;
          await sendFile(file, connection);
        }
      });

      document.getElementById('refresh-btn').addEventListener('click', () => {
        location.reload();
      });

      window.addEventListener('pagehide', () => {
        objectUrls.splice(0).forEach((url) => URL.revokeObjectURL(url));
      });

      initializePeer();

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/POSTBOX/service-worker.js")
            .then((registration) => {
              console.log("Service Worker registered with scope:", registration.scope);
            })
            .catch((error) => {
              console.error("Service Worker registration failed:", error);
            });
        });
      }
    </script>
  </body>
</html>
