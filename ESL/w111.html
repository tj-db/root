<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chess Timer</title>
  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #fff;
      color: #000;
    }
    body {
      font-family: 'Courier New', monospace;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
    }
    .timer-container {
      display: flex;
      justify-content: space-around;
      align-items: flex-start;
      gap: 24px;
      padding: 32px 24px 0;
    }
    .player {
      flex: 1;
      text-align: center;
      color: #000;
      opacity: 0.25;
      transition: opacity 0.2s ease;
    }
    .player.active { opacity: 1; }
    .player.paused { opacity: 0.45; }
    .time-display {
      font-size: clamp(48px, 14vw, 160px);
      font-weight: 700;
      line-height: 1;
    }
    .player.warning .time-display { text-decoration: underline; }
    .player.critical { animation: blink 1s steps(1) infinite; }
    .player.time-up { opacity: 1; animation: blink 0.6s steps(1) infinite; }
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0.2; }
    }
  </style>
</head>
<body>
  <div class="timer-container" id="timerContainer">
    <div class="player" id="player1" data-player="1">
      <div class="time-display" id="time1">1:11</div>
    </div>
    <div class="player" id="player2" data-player="2">
      <div class="time-display" id="time2">1:11</div>
    </div>
  </div>
  <script>
    class ChessTimer {
      constructor(initialTime) {
        this.initialTime = initialTime
        this.player1Time = initialTime
        this.player2Time = initialTime
        this.activePlayer = null
        this.gameRunning = false
        this.gameEnded = false
        this.paused = false
        this.interval = null
        this.player1El = document.getElementById('player1')
        this.player2El = document.getElementById('player2')
        this.time1El = document.getElementById('time1')
        this.time2El = document.getElementById('time2')
        this.inputBuffer = ""
        this.inputTimeout = null
        this.bindEvents()
        this.updateDisplay()
      }

      bindEvents() {
        document.addEventListener('keydown', (e) => {
          if (e.code === 'Space') {
            e.preventDefault()
            this.switchPlayer()
          }
          if (e.code === 'Enter') {
            e.preventDefault()
            this.togglePause()
          }
          if (e.key >= "0" && e.key <= "9") {
            this.handleNumberInput(e.key)
          }
        })
        document.body.addEventListener('click', () => {
          if (!this.gameEnded && !this.paused) this.switchPlayer()
        })
      }

      handleNumberInput(digit) {
        this.inputBuffer += digit
        if (this.inputTimeout) clearTimeout(this.inputTimeout)
        this.inputTimeout = setTimeout(() => {
          const newTime = parseInt(this.inputBuffer, 10)
          if (!isNaN(newTime) && newTime > 0) {
            this.resetClock(newTime)
          }
          this.inputBuffer = ""
        }, 3000)
      }

      resetClock(seconds) {
        this.initialTime = seconds
        this.player1Time = seconds
        this.player2Time = seconds
        this.activePlayer = null
        this.gameRunning = false
        this.gameEnded = false
        this.paused = false
        if (this.interval) clearInterval(this.interval)
        this.interval = null
        this.player1El.className = "player"
        this.player2El.className = "player"
        this.updateDisplay()
      }

      switchPlayer() {
        if (this.gameEnded) return
        if (!this.gameRunning) {
          this.activePlayer = this.activePlayer || 1
          this.gameRunning = true
          this.startTimer()
        } else {
          this.activePlayer = this.activePlayer === 1 ? 2 : 1
          this.player1El.classList.remove('warning', 'critical')
          this.player2El.classList.remove('warning', 'critical')
          this.updateWarningStates()
        }
        this.updateDisplay()
      }

      startTimer() {
        if (this.interval) clearInterval(this.interval)
        this.interval = setInterval(() => {
          if (this.activePlayer === 1) {
            this.player1Time--
            if (this.player1Time <= 0) { this.endGame(2); return }
          } else {
            this.player2Time--
            if (this.player2Time <= 0) { this.endGame(1); return }
          }
          this.updateDisplay()
          this.updateWarningStates()
        }, 1000)
      }

      togglePause() {
        if (!this.gameRunning || this.gameEnded) return
        if (this.interval) {
          clearInterval(this.interval)
          this.interval = null
          this.paused = true
        } else {
          this.startTimer()
          this.paused = false
        }
        this.updateDisplay()
      }

      updateWarningStates() {
        const currentTime = this.activePlayer === 1 ? this.player1Time : this.player2Time
        const activeEl = this.activePlayer === 1 ? this.player1El : this.player2El
        const warningTime = Math.max(10, this.initialTime * 0.1)
        const criticalTime = Math.max(5, this.initialTime * 0.05)
        activeEl.classList.remove('warning', 'critical')
        if (currentTime <= criticalTime) {
          activeEl.classList.add('critical')
        } else if (currentTime <= warningTime) {
          activeEl.classList.add('warning')
        }
      }

      endGame(winner) {
        this.gameEnded = true
        this.gameRunning = false
        this.paused = false
        if (this.interval) clearInterval(this.interval)
        this.interval = null
        if (this.player1Time <= 0) {
          this.player1Time = 0
          this.player1El.classList.add('time-up')
        } else {
          this.player2Time = 0
          this.player2El.classList.add('time-up')
        }
        this.updateDisplay()
      }

      updateDisplay() {
        this.time1El.textContent = this.formatTime(this.player1Time)
        this.time2El.textContent = this.formatTime(this.player2Time)
        this.player1El.classList.toggle('active', this.activePlayer === 1)
        this.player2El.classList.toggle('active', this.activePlayer === 2)
        this.player1El.classList.toggle('paused', this.paused && this.activePlayer === 1)
        this.player2El.classList.toggle('paused', this.paused && this.activePlayer === 2)
      }

      formatTime(seconds) {
        if (seconds >= 60) {
          const mins = Math.floor(seconds / 60)
          const secs = seconds % 60
          return `${mins}:${secs.toString().padStart(2, '0')}`
        }
        return seconds.toString()
      }
    }

    new ChessTimer(71)
  </script>
</body>
</html>
