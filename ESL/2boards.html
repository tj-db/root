<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Scatter Board</title>
  <style>
    :root {
      --blue: #35a9f4;
      --blue-soft: #eaf6ff;
      --gold: #ffb629;
      --gold-soft: #fff6df;
      --ink: #17264a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      padding: 14px 18px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
      color: var(--ink);
      background: #f6f8fc;
      font-family: "Trebuchet MS", Arial, sans-serif;
    }
    h1 { text-align: center; margin: 0; font-size: clamp(1.2rem, 3vw, 1.8rem); flex: none; }
    .editor {
      flex: none;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .editor.collapsed { display: none; }
    .input-card {
      background: white;
      border: 1px solid #dce4ef;
      border-radius: 14px;
      padding: 10px 12px;
      box-shadow: 0 5px 18px #2638580d;
    }
    label { display: block; font-weight: 800; margin-bottom: 6px; font-size: 14px; }
    .blue-label { color: #147fc2; }
    .gold-label { color: #a66a00; }
    textarea {
      width: 100%;
      height: 74px;
      resize: none;
      border: 1px solid #ccd6e5;
      border-radius: 10px;
      padding: 8px 10px;
      font: 14px/1.4 inherit;
      outline-color: var(--blue);
    }
    .error { flex: none; margin: 0; text-align: center; color: #b42318; font-weight: 700; font-size: 13px; }
    .error:empty { display: none; }
    .actions { flex: none; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    button {
      border: 0;
      border-radius: 999px;
      padding: 9px 18px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      background: #1e73b7;
      color: white;
      box-shadow: 0 3px 0 #14588f;
    }
    button.secondary { background: #64748b; box-shadow: 0 3px 0 #475569; }
    button:hover { filter: brightness(1.06); }
    .board {
      flex: 1 1 0;
      min-height: 0;
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 16px;
    }
    .panel {
      min-height: 0;
      min-width: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 5px solid var(--blue);
      border-radius: 28px;
      background: var(--blue-soft);
      padding: 14px 14px 14px;
    }
    .panel.antonyms { border-color: var(--gold); background: var(--gold-soft); }
    .panel h2 {
      flex: none;
      align-self: center;
      margin: -14px 0 10px;
      padding: 8px 28px 10px;
      border-radius: 0 0 22px 22px;
      background: #bfe4ff;
      border: 3px solid var(--blue);
      border-top: 0;
      color: #102958;
      text-align: center;
      font-size: clamp(1.1rem, 2.2vw, 1.7rem);
    }
    .antonyms h2 { background: #ffdf82; border-color: var(--gold); }
    .word-cloud {
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
      font-size: var(--fs, 16px);
    }
    .tiles {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-content: center;
      gap: 0.55em 0.5em;
      width: 100%;
      padding: 0.3em;
    }
    .tile {
      flex: none;
      white-space: nowrap;
      padding: 0.3em 0.75em;
      border-radius: 0.7em;
      border: 2px solid;
      font-size: 1em;
      font-weight: 800;
      line-height: 1.15;
      text-align: center;
      box-shadow: 0 3px 0 #17264a12;
      transform: rotate(var(--tilt));
      animation: pop .25s ease-out both;
    }
    @keyframes pop { from { opacity: 0; scale: .8; } to { opacity: 1; scale: 1; } }
    .empty {
      color: #8793a6;
      text-align: center;
      padding: 20px 12px;
      font-style: italic;
      font-size: 15px;
      margin: auto;
    }
    @media (max-width: 760px) {
      body { padding: 8px 8px; gap: 7px; }
      .editor { gap: 8px; }
      .input-card { padding: 7px; }
      label { font-size: 12px; margin-bottom: 4px; }
      textarea { height: 56px; font-size: 13px; }
      .board { gap: 7px; }
      .panel { padding: 8px 6px 8px; border-radius: 16px; border-width: 3px; }
      .panel h2 { font-size: 14px; padding: 6px 12px 7px; margin: -8px 0 6px; }
      .tile { border-width: 1.5px; }
      .actions { gap: 7px; }
      button { padding: 8px 12px; font-size: 12px; }
    }
    @media (max-height: 560px) {
      h1 { display: none; }
    }
    @page { size: A4 landscape; margin: 7mm; }
    @media print {
      html, body { height: auto; }
      body { background: white; padding: 0; margin: 0; display: block; overflow: visible; }
      .editor, .actions, .error, h1 { display: none !important; }
      .board {
        width: 100%;
        max-width: none;
        height: 195mm;
        gap: 5mm;
        grid-template-columns: 1fr 1fr;
      }
      .panel {
        height: 195mm;
        padding: 4mm;
        border-width: 2px;
        border-radius: 12px;
        break-inside: avoid;
      }
      .panel h2 {
        font-size: 16pt;
        padding: 2mm 8mm;
        margin: -4mm 0 3mm;
        border-width: 2px;
      }
      .tile {
        border-width: 1px;
        box-shadow: none;
        animation: none;
        break-inside: avoid;
      }
    }
  </style>
</head>
<body>
  <h1>Word Scatter Board</h1>

  <section class="editor" id="editor" aria-label="Word inputs">
    <div class="input-card">
      <label class="blue-label" for="wordsInput">Section 1 — English Words</label>
      <textarea id="wordsInput" placeholder="Happy&#10;Strong&#10;Open&#10;Beautiful"></textarea>
    </div>
    <div class="input-card">
      <label class="gold-label" for="antonymsInput">Section 2 — Antonyms</label>
      <textarea id="antonymsInput" placeholder="Sad&#10;Weak&#10;Closed&#10;Ugly"></textarea>
    </div>
  </section>

  <p class="error" id="errorMessage" role="alert"></p>
  <div class="actions">
    <button id="createButton">Create word board</button>
    <button class="secondary" id="shuffleButton" type="button">Shuffle words</button>
    <button class="secondary" id="toggleButton" type="button">Hide inputs</button>
    <button class="secondary" id="printButton" type="button">Print board</button>
  </div>

  <main class="board">
    <section class="panel">
      <h2>English Words</h2>
      <div class="word-cloud" id="wordsCloud"></div>
    </section>
    <section class="panel antonyms">
      <h2>Antonyms</h2>
      <div class="word-cloud" id="antonymsCloud"></div>
    </section>
  </main>

  <script>
    const palette = [
      ["#ffe17a", "#ffbd24", "#49320b"],
      ["#d8b8ff", "#ad7be9", "#251447"],
      ["#b9e987", "#83c94b", "#203d16"],
      ["#ffb7d2", "#f27ca9", "#4b1830"],
      ["#b7dcff", "#69b6f5", "#102d59"],
      ["#ffc58f", "#ff9b43", "#51270c"]
    ];

    const wordsInput = document.getElementById("wordsInput");
    const antonymsInput = document.getElementById("antonymsInput");
    const wordsCloud = document.getElementById("wordsCloud");
    const antonymsCloud = document.getElementById("antonymsCloud");
    const errorMessage = document.getElementById("errorMessage");
    const editor = document.getElementById("editor");
    const toggleButton = document.getElementById("toggleButton");

    function parseWords(value) {
      return value.split(/[\n,;]+/).map(word => word.trim()).filter(Boolean);
    }

    function shuffled(items) {
      const result = [...items];
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    function fits(cloud, tiles) {
      return tiles.offsetHeight <= cloud.clientHeight && tiles.scrollWidth <= tiles.clientWidth + 1;
    }

    function fitCloud(cloud) {
      const tiles = cloud.querySelector(".tiles");
      if (!tiles) return;
      let low = 6;
      let high = 44;
      cloud.style.setProperty("--fs", low + "px");
      if (!fits(cloud, tiles)) return;
      while (high - low > 0.25) {
        const mid = (low + high) / 2;
        cloud.style.setProperty("--fs", mid + "px");
        if (fits(cloud, tiles)) low = mid; else high = mid;
      }
      cloud.style.setProperty("--fs", low + "px");
    }

    function fitAll() {
      fitCloud(wordsCloud);
      fitCloud(antonymsCloud);
    }

    function renderCloud(container, items, emptyText) {
      container.replaceChildren();
      if (!items.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = emptyText;
        container.appendChild(empty);
        return;
      }
      const tiles = document.createElement("div");
      tiles.className = "tiles";
      shuffled(items).forEach((word, index) => {
        const tile = document.createElement("span");
        const colors = palette[Math.floor(Math.random() * palette.length)];
        tile.className = "tile";
        tile.textContent = word;
        tile.style.background = colors[0];
        tile.style.borderColor = colors[1];
        tile.style.color = colors[2];
        tile.style.setProperty("--tilt", `${(Math.random() * 6 - 3).toFixed(1)}deg`);
        tile.style.animationDelay = `${Math.min(index * 15, 250)}ms`;
        tiles.appendChild(tile);
      });
      container.appendChild(tiles);
      fitCloud(container);
    }

    function createBoard() {
      errorMessage.textContent = "";
      renderCloud(wordsCloud, parseWords(wordsInput.value), "Add English words above to fill this side.");
      renderCloud(antonymsCloud, parseWords(antonymsInput.value), "Add antonyms above to fill this side.");
    }

    document.getElementById("createButton").addEventListener("click", createBoard);
    document.getElementById("shuffleButton").addEventListener("click", createBoard);
    document.getElementById("printButton").addEventListener("click", () => window.print());
    toggleButton.addEventListener("click", () => {
      const hidden = editor.classList.toggle("collapsed");
      toggleButton.textContent = hidden ? "Show inputs" : "Hide inputs";
      requestAnimationFrame(fitAll);
    });

    window.addEventListener("resize", fitAll);
    window.addEventListener("beforeprint", fitAll);
    window.addEventListener("afterprint", fitAll);
    window.matchMedia("print").addEventListener("change", fitAll);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);

    createBoard();
  </script>
</body>
</html>
