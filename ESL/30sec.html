<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>30 Seconds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #12172B;
    --navy-deep: #0B0E1D;
    --amber: #FFB020;
    --amber-dim: #7A5615;
    --cream: #F5F1E8;
    --red: #FF5C5C;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% -10%, #1D2440, var(--navy-deep) 70%);
    color: var(--cream);
    font-family: 'Space Mono', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .stage {
    width: 100%;
    max-width: 640px;
  }

  .eyebrow {
    letter-spacing: 0.4em;
    text-transform: uppercase;
    font-size: 12px;
    color: var(--amber);
    text-align: center;
    margin-bottom: 8px;
  }

  h1 {
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(40px, 9vw, 72px);
    text-align: center;
    margin: 0 0 32px;
    letter-spacing: -0.02em;
  }

  .panel {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    padding: 28px;
  }

  .controls-row {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 12px;
  }

  label {
    font-size: 13px;
    color: rgba(245,241,232,0.8);
  }

  input[type="number"] {
    width: 110px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.08);
    background: var(--navy-deep);
    color: var(--cream);
    font-family: 'Space Mono', monospace;
    font-size: 14px;
  }

  textarea {
    width: 100%;
    min-height: 220px;
    resize: vertical;
    background: var(--navy-deep);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    color: var(--cream);
    font-family: 'Space Mono', monospace;
    font-size: 15px;
    padding: 16px;
    line-height: 1.6;
  }

  textarea::placeholder { color: rgba(245,241,232,0.35); }

  .hint {
    font-size: 12px;
    color: rgba(245,241,232,0.5);
    margin: 10px 2px 22px;
  }

  button {
    font-family: 'Archivo Black', sans-serif;
    font-size: 16px;
    letter-spacing: 0.03em;
    border: none;
    border-radius: 10px;
    padding: 16px;
    width: 100%;
    cursor: pointer;
    background: var(--amber);
    color: var(--navy-deep);
    transition: transform 0.12s ease, background 0.2s ease;
  }

  button:hover { background: #ffc450; }
  button:active { transform: scale(0.98); }

  button.ghost {
    background: transparent;
    color: var(--cream);
    border: 1px solid rgba(255,255,255,0.2);
    margin-top: 12px;
  }

  button.ghost:hover { border-color: var(--amber); color: var(--amber); }

  .hidden { display: none !important; }

  .timer-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .round-label {
    font-size: 12px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(245,241,232,0.5);
  }

  .timer {
    font-family: 'Archivo Black', sans-serif;
    font-size: 48px;
    color: var(--amber);
    font-variant-numeric: tabular-nums;
  }

  .timer.urgent { color: var(--red); }

  .bar-track {
    height: 8px;
    background: rgba(255,255,255,0.08);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 28px;
  }

  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--amber), var(--red));
    width: 100%;
    transform-origin: left;
    transition: width 0.25s linear;
  }

  .word-grid {
    display: grid;
    gap: 10px;
    margin-bottom: 24px;
  }

  .word-row {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--navy-deep);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 14px 18px;
  }

  .word-num {
    font-size: 13px;
    color: var(--amber-dim);
    width: 20px;
  }

  .word-text {
    font-family: 'Archivo Black', sans-serif;
    font-size: 19px;
  }

  .end-icon {
    text-align: center;
    font-size: 48px;
    margin-bottom: 8px;
  }

  .end-title {
    font-family: 'Archivo Black', sans-serif;
    font-size: 30px;
    text-align: center;
    margin: 0 0 8px;
  }

  .end-sub {
    text-align: center;
    color: rgba(245,241,232,0.6);
    font-size: 14px;
    margin-bottom: 28px;
  }
</style>
</head>
<body>

<div class="stage">
  <h1>30 SECONDS</h1>

  <div id="setup" class="panel">
    <div class="controls-row">
      <label for="roundSecondsInput">Seconds per round</label>
      <input id="roundSecondsInput" type="number" min="5" max="300" value="30" />
    </div>

    <textarea id="wordInput" placeholder="banana&#10;volcano&#10;guitar&#10;..."></textarea>
    <button id="startBtn">Start Game</button>
  </div>

  <div id="game" class="panel hidden">
    <div class="timer-row">
      <div class="round-label">Round <span id="roundNum">1</span></div>
      <div class="timer" id="timer">30</div>
    </div>
    <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
    <div class="word-grid" id="wordGrid"></div>
    <button id="skipBtn" class="ghost">Skip to Next Round</button>
  </div>
</div>

<script>
const DEFAULT_SECONDS = 30;
const WORDS_PER_ROUND = 5;

const setupEl = document.getElementById('setup');
const gameEl = document.getElementById('game');
const wordInput = document.getElementById('wordInput');
const wordGrid = document.getElementById('wordGrid');
const timerEl = document.getElementById('timer');
const barFill = document.getElementById('barFill');
const roundNumEl = document.getElementById('roundNum');
const roundSecondsInput = document.getElementById('roundSecondsInput');

let wordPool = [];
let rounds = [];
let roundIndex = 0;
let secondsLeft = DEFAULT_SECONDS;
let roundSeconds = DEFAULT_SECONDS;
let intervalId = null;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function chunk(arr, size) {
  const out = [];
  for (let i = 0; i < arr.length; i += size) {
    out.push(arr.slice(i, i + size));
  }
  return out;
}

function startGame() {
  // Read and validate seconds from the numeric input above the word list
  const n = parseInt(roundSecondsInput.value, 10);
  roundSeconds = (Number.isFinite(n) && n >= 5) ? n : DEFAULT_SECONDS;

  const words = (wordInput.value || '')
    .split('\n')
    .map(w => w.trim())
    .filter(Boolean);

  if (words.length < WORDS_PER_ROUND) {
    alert('Please enter at least 5 words, one per line.');
    return;
  }

  wordPool = words;
  rounds = chunk(shuffle(wordPool), WORDS_PER_ROUND);
  roundIndex = 0;
  setupEl.classList.add('hidden');
  gameEl.classList.remove('hidden');
  playRound();
}

function playRound() {
  const words = rounds[roundIndex];
  roundNumEl.textContent = roundIndex + 1;
  wordGrid.innerHTML = words
    .map((w, i) => `
      <div class="word-row">
        <span class="word-num">${String(i + 1).padStart(2, '0')}</span>
        <span class="word-text">${escapeHtml(w)}</span>
      </div>
    `).join('');

  secondsLeft = roundSeconds;
  updateTimerDisplay();
  clearInterval(intervalId);
  intervalId = setInterval(tick, 1000);
}

function tick() {
  secondsLeft -= 1;
  updateTimerDisplay();
  if (secondsLeft <= 0) {
    nextRound();
  }
}

function updateTimerDisplay() {
  timerEl.textContent = secondsLeft;
  timerEl.classList.toggle('urgent', secondsLeft <= 10);
  const pct = Math.max(0, Math.min(1, secondsLeft / roundSeconds));
  barFill.style.width = `${pct * 100}%`;
}

function nextRound() {
  clearInterval(intervalId);
  roundIndex += 1;
  if (roundIndex >= rounds.length) {
    rounds = chunk(shuffle(wordPool), WORDS_PER_ROUND);
    roundIndex = 0;
  }
  playRound();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('skipBtn').addEventListener('click', nextRound);
</script>

</body>
</html>
