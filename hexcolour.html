<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hex Colour Selector</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#18202a;--mute:#5d6977;--line:#d8dee6;--hue-pure:#1f6fe0;--pick:#1f6fe0}
@media (prefers-color-scheme:dark){:root{--bg:#0f141a;--card:#18202a;--ink:#e8edf3;--mute:#9aa6b3;--line:#2b3744}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.swatch{height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 16px;transition:color .15s}
#hex{width:100%;background:none;border:0;border-bottom:2px solid transparent;color:inherit;text-align:center;font:700 2.7rem ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.04em;padding:0;outline:none;text-transform:uppercase}
#hex:focus-visible{border-bottom-color:currentColor}
.status{margin:4px 0 0;min-height:1.5em;font-size:.95rem;opacity:0;transition:opacity .2s}
.status.on{opacity:.9}
.controls{padding:20px}
.sv{position:relative;height:210px;border-radius:10px;cursor:crosshair;touch-action:none;user-select:none;background:linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,var(--hue-pure))}
.sv:focus-visible,#hue:focus-visible,button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.knob{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:3px solid #fff;background:var(--pick);box-shadow:0 0 0 1px rgba(0,0,0,.45),0 2px 5px rgba(0,0,0,.4);pointer-events:none}
#hue{-webkit-appearance:none;appearance:none;display:block;width:100%;height:14px;margin:22px 0 0;border-radius:7px;background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);cursor:pointer}
#hue::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;border:3px solid #fff;background:var(--hue-pure);box-shadow:0 0 0 1px rgba(0,0,0,.45),0 2px 5px rgba(0,0,0,.4)}
#hue::-moz-range-thumb{width:18px;height:18px;border-radius:50%;border:3px solid #fff;background:var(--hue-pure);box-shadow:0 0 0 1px rgba(0,0,0,.45),0 2px 5px rgba(0,0,0,.4)}
#hue::-moz-range-track{background:transparent}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:22px}
.vals{margin:0;font:.9rem/1.6 ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--mute)}
button{font:inherit;font-weight:600;color:var(--card);background:var(--ink);border:0;border-radius:8px;padding:10px 22px;cursor:pointer}
button:active{transform:translateY(1px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="card">
<div class="swatch" id="swatch">
<input id="hex" type="text" maxlength="7" spellcheck="false" autocomplete="off" aria-label="Hex colour code">
<p class="status" id="status" role="status"></p>
</div>
<div class="controls">
<div class="sv" id="sv" tabindex="0" role="group" aria-label="Saturation and brightness. Use the arrow keys to adjust.">
<div class="knob" id="knob"></div>
</div>
<input id="hue" type="range" min="0" max="360" step="1" value="210" aria-label="Hue">
<div class="row">
<p class="vals"><span id="rgb"></span><br><span id="hsl"></span></p>
<button type="button" id="copy">Copy</button>
</div>
</div>
</main>
<script>
(function () {
  var h = 215, s = 0.86, v = 0.88, current = "";
  var dragging = false, timer = 0, hideTimer = 0;
  var $ = function (id) { return document.getElementById(id); };
  var sv = $("sv"), knob = $("knob"), hue = $("hue"), hexIn = $("hex");
  var swatch = $("swatch"), status = $("status"), rgbEl = $("rgb"), hslEl = $("hsl");

  function clamp(n) { return Math.min(1, Math.max(0, n)); }

  function hsvToRgb(h, s, v) {
    var c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c, r = 0, g = 0, b = 0;
    if (h < 60) { r = c; g = x; }
    else if (h < 120) { r = x; g = c; }
    else if (h < 180) { g = c; b = x; }
    else if (h < 240) { g = x; b = c; }
    else if (h < 300) { r = x; b = c; }
    else { r = c; b = x; }
    return [r + m, g + m, b + m].map(function (n) { return Math.round(n * 255); });
  }

  function rgbToHsv(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min, hh = 0;
    if (d) {
      if (max === r) hh = ((g - b) / d) % 6;
      else if (max === g) hh = (b - r) / d + 2;
      else hh = (r - g) / d + 4;
      hh *= 60;
      if (hh < 0) hh += 360;
    }
    return { h: hh, s: max ? d / max : 0, v: max };
  }

  function toHex(rgb) {
    return "#" + rgb.map(function (n) { return (n < 16 ? "0" : "") + n.toString(16); }).join("").toUpperCase();
  }

  function toHsl(rgb) {
    var r = rgb[0] / 255, g = rgb[1] / 255, b = rgb[2] / 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2, d = max - min;
    var sat = d ? d / (1 - Math.abs(2 * l - 1)) : 0;
    return Math.round(rgbToHsv(rgb[0], rgb[1], rgb[2]).h) + ", " + Math.round(sat * 100) + "%, " + Math.round(l * 100) + "%";
  }

  function render(keepInput) {
    var rgb = hsvToRgb(h, s, v), hex = toHex(rgb);
    var root = document.documentElement.style;
    root.setProperty("--hue-pure", toHex(hsvToRgb(h, 1, 1)));
    root.setProperty("--pick", hex);
    swatch.style.background = hex;
    swatch.style.color = (rgb[0] * 299 + rgb[1] * 587 + rgb[2] * 114) / 1000 >= 150 ? "#111" : "#fff";
    knob.style.left = s * 100 + "%";
    knob.style.top = (1 - v) * 100 + "%";
    hue.value = Math.round(h);
    if (!keepInput) hexIn.value = hex;
    rgbEl.textContent = "rgb(" + rgb.join(", ") + ")";
    hslEl.textContent = "hsl(" + toHsl(rgb) + ")";
    current = hex;
  }

  function flash(msg) {
    status.textContent = msg;
    status.classList.add("on");
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () { status.classList.remove("on"); }, 1800);
  }

  function fallbackCopy(text) {
    var t = document.createElement("textarea");
    var ok = false;
    t.value = text;
    t.setAttribute("readonly", "");
    t.style.position = "fixed";
    t.style.opacity = "0";
    document.body.appendChild(t);
    t.select();
    try { ok = document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(t);
    return ok;
  }

  function copy() {
    var text = current;
    var finish = function (ok) {
      flash(ok ? "Copied " + text + " to clipboard" : "Copy blocked. Select the code and copy it.");
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { finish(true); }, function () { finish(fallbackCopy(text)); });
    } else {
      finish(fallbackCopy(text));
    }
  }

  function queue() {
    clearTimeout(timer);
    timer = setTimeout(copy, 450);
  }

  function pick(e) {
    var r = sv.getBoundingClientRect();
    s = clamp((e.clientX - r.left) / r.width);
    v = 1 - clamp((e.clientY - r.top) / r.height);
    render();
  }

  sv.addEventListener("pointerdown", function (e) {
    dragging = true;
    sv.setPointerCapture(e.pointerId);
    pick(e);
  });
  sv.addEventListener("pointermove", function (e) { if (dragging) pick(e); });
  sv.addEventListener("pointerup", function () {
    if (!dragging) return;
    dragging = false;
    copy();
  });
  sv.addEventListener("pointercancel", function () { dragging = false; });

  sv.addEventListener("keydown", function (e) {
    var step = e.shiftKey ? 0.1 : 0.01;
    if (e.key === "ArrowLeft") s -= step;
    else if (e.key === "ArrowRight") s += step;
    else if (e.key === "ArrowUp") v += step;
    else if (e.key === "ArrowDown") v -= step;
    else return;
    e.preventDefault();
    s = clamp(s);
    v = clamp(v);
    render();
    queue();
  });

  hue.addEventListener("input", function () {
    h = +hue.value;
    render();
  });
  hue.addEventListener("change", copy);

  hexIn.addEventListener("focus", function () { hexIn.select(); });
  hexIn.addEventListener("input", function () {
    var m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(hexIn.value.trim());
    if (!m) return;
    var x = m[1];
    if (x.length === 3) x = x.replace(/./g, "$&$&");
    var n = parseInt(x, 16), o = rgbToHsv(n >> 16, (n >> 8) & 255, n & 255);
    if (o.s > 0 && o.v > 0) h = o.h;
    s = o.s;
    v = o.v;
    render(true);
    queue();
  });
  hexIn.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      clearTimeout(timer);
      hexIn.value = current;
      copy();
    }
  });
  hexIn.addEventListener("blur", function () { hexIn.value = current; });

  $("copy").addEventListener("click", copy);

  render();
})();
</script>
</body>
</html>
